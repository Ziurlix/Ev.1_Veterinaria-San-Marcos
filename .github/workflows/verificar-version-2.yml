name: Verificar version 2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Veterinaria-San-Marcos-Version-2

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Veterinaria-San-Marcos-Version-2/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas unitarias
        run: npm run test:karma

      - name: Comprobar compilacion
        run: npm run build
