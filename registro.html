<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Registro | Veterinaria San Marcos </title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
   
    <header>  <!-- Header Copiado -->
        <div> 
            <img src ="https://irp.cdn-website.com/ddaef7ae/dms3rep/multi/opt/LOGO-VETERINARIA-220w.png" alt ="Logo veterinaria" width ="50">
            <span> Veterinaria San Marcos</span>
        </div>

        <nav> 
            <ul> 
                <li> <a href ="index.html">  Home </a> </li>
                <li> <a href ="servicios.html"> Servicios </a></a></li>
                <li> <a href ="equipo.html"> Equipo </a></li>
                <li> <a href ="portal.html"> Portal </a></li>
                <li> <a href ="contacto.html"> Contacto </a></li>
            </ul>
        </nav>

        <div>
            <button onclick ="window.location.href='login.html'"> Iniciar Sesión </button>
            <button onclick ="window.location.href='registro.html'"> Registrarse </button>
        </div>
     </header>

  
    <main> <!-- Formulario Login --> 
        <section> 
            <div class ="login-container">
                <h1 class="form-title"> Crear Cuenta </h1>
                <form id ="loginForm" novalidate>

                    <div> <!-- 1. Nombre --> 
                        <label for ="user"> Nombre Completo </label>
                        <input type ="text" id ="user" placeholder ="Nombre completo" class ="input">
                        <span id ="error-user" class="error-text"></span>
                    </div>

                    <div> <!-- 2. Email-->
                        <label for ="email"> Dirección de correo </label>
                        <input type ="email" id ="email" placeholder ="Dirección de correo" class ="input">
                        <span id ="error-email" class="error-text"></span>
                    </div>

                    <div> <!-- 3. Telefono --> 
                        <label for ="phone"> Número de teléfono </label>
                        <input type ="tel" id ="phone" placeholder ="Número de teléfono" class ="input">
                        <span id ="error-phone" class="error-text"></span>
                    </div>

                    <div> <!-- 4. Contraseña -->
                        <label for="password">Crea una contraseña</label>
                        <input type="password" id="password" placeholder="Crea una contraseña" class="input">
                        <span id="error-psw" class="error-text"></span>
                    </div>

                    <div> <!-- 5. Confirmar Contraseña -->
                        <label for="confirm-psw">Confirma tu contraseña</label>
                        <input type="password" id="confirm-psw" placeholder="Confirma tu contraseña" class="input">
                        <span id="error-confirm" class="error-text"></span>
                    </div>

                    <!-- 6. Términos y condiciones -->
                    <div class="checkbox-container mb-15">
                        <input type="checkbox" id="terms" name="terminos">
                        <label for="terms"> Acepto los <a href="#">términos de uso</a></label>  
                    </div>

                    <!-- 7. Botón envío -->
                    <button type="submit" class="mb-15"> Crear Cuenta </button>

                    <!-- 8. Enlace al login -->
                    <div class="text-center">
                        <label> ¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a></label>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <footer> <!-- Footer Copiado--> 
        <div class="footer-info">
            <p> Dirección: Rancagua, Región de O'Higgins </p>
            <p> Contacto: +56 9 1234 5678 </p>
        </div>

        <div class ="footer-copy">
            <p> &copy; 2024 Veterinaria San Marcos. Todos los derechos reservados. </p>
        </div>
    </footer>

    <script src ="script.js"></script>

    
</body>
</html>
