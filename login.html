                    </div>

                    <div> <!-- Contraseña-->
                        <label for ="login-psw"> Contraseña </label>
                        <input type ="password" id ="login-psw" placeholder ="Ingresa tu contraseña" class ="input">
                    </div>
                
                    <button type ="submit" class="mt-15 mb-15"> Ingresar </button>
                
                    <div class="text-center">
                        <label> ¿No tienes cuenta? <a href ="registro.html"> Registrate acá </a></label>
                    </div>
                </form>
